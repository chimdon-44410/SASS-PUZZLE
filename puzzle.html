<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sass puzzle</title>
</head>
<body>
  <header class="header">
    <div>
       <!-- ↑class="box_header" -->
      <!-- ヘッダーの文字は透明です -->
        <ul class="list_header">
          <li class="purple absolute">
            <p class="little_box">ボックス紫</p>
          </li>
          <li class="orange absolute">
            <p class="little_box">ボックス橙</p>
          </li>
          <li class="blue absolute">
            <p class="little_box">ボックス青</p>
          </li>
        </ul>
      </div>
  </header>
  <article>
    <div class="side">
      <p>サイドバーの文字は透明です</p>
    </div>
    <div class="box_main">
      <!-- <p>メインコンテンツの文字は透明です</p> -->
        <ul class="list_main">
          <li class="purple">
            <p class="large_box">ボックス紫</p>
          </li>
          <li class="orange">
            <p class="large_box">ボックス橙</p>
          </li>
          <li class="blue">
            <p class="large_box">ボックス青</p>
          </li>
        </ul>
    </div>
  </article>
  <footer class="footer">
    <p>フッターの文字は透明です</p>
  </footer>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
